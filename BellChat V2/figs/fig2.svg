<svg viewBox="0 0 820 540" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#2c3e50"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#e67e22"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#2980b9"/>
    </marker>
    <filter id="sh" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="3" flood-color="#00000025"/>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <rect width="820" height="540" fill="#f8f9fa" rx="8"/>

  <!-- ══ TITLE ══ -->
  <text x="410" y="22" font-size="13" fill="#2c3e50" font-weight="800" text-anchor="middle">
    Flujo de Comunicación Segura y Accesible con Cifrado E2E e IA
  </text>

  <!-- ══════════════════════════════════════════
       KEY REPOSITORY — top center
  ══════════════════════════════════════════ -->
  <!-- cylinder -->
  <ellipse cx="410" cy="60" rx="55" ry="14" fill="#aed6f1" stroke="#2980b9" stroke-width="1.5"/>
  <rect x="355" y="60" width="110" height="50" fill="#d6eaf8" stroke="#2980b9" stroke-width="1.5"/>
  <ellipse cx="410" cy="110" rx="55" ry="14" fill="#aed6f1" stroke="#2980b9" stroke-width="1.5"/>
  <text x="410" y="82" font-size="10" fill="#1a5276" text-anchor="middle" font-weight="700">REPOSITORIO</text>
  <text x="410" y="96" font-size="10" fill="#1a5276" text-anchor="middle" font-weight="700">DE LLAVES</text>
  <!-- key icon -->
  <circle cx="410" cy="128" r="9" fill="#f39c12"/>
  <rect x="413" y="122" width="14" height="4" rx="1" fill="#f39c12"/>
  <rect x="422" y="122" width="3" height="6" rx="1" fill="#f39c12"/>
  <circle cx="406" cy="128" r="4" fill="none" stroke="#fff" stroke-width="1.5"/>
  <!-- SECRET KEY label -->
  <rect x="370" y="140" width="80" height="18" rx="3" fill="#e74c3c"/>
  <text x="410" y="153" font-size="9" fill="white" font-weight="700" text-anchor="middle">SECRET KEY</text>
  <!-- DECRYPTION label -->
  <rect x="360" y="162" width="100" height="18" rx="3" fill="#e67e22"/>
  <text x="410" y="175" font-size="9" fill="white" font-weight="700" text-anchor="middle">DECRYPTION</text>

  <!-- ══════════════════════════════════════════
       PERSON 1 (Sender) — left
  ══════════════════════════════════════════ -->
  <!-- Person icon -->
  <circle cx="100" cy="230" r="22" fill="#3498db" filter="url(#sh)"/>
  <circle cx="100" cy="220" r="9" fill="#d6eaf8"/>
  <ellipse cx="100" cy="244" rx="13" ry="8" fill="#d6eaf8"/>
  <text x="100" y="260" font-size="10" fill="#1a5276" text-anchor="middle" font-weight="700">Persona 1</text>
  <text x="100" y="272" font-size="8.5" fill="#555" text-anchor="middle">(Emisor)</text>

  <!-- Lock icon (encrypt at source) -->
  <rect x="60" y="290" width="80" height="46" rx="5" fill="#eaf4fb" stroke="#2980b9" stroke-width="1.3" filter="url(#sh)"/>
  <rect x="77" y="298" width="20" height="14" rx="10" fill="none" stroke="#2980b9" stroke-width="2"/>
  <rect x="73" y="308" width="28" height="20" rx="3" fill="#2980b9"/>
  <circle cx="87" cy="318" r="3" fill="white"/>
  <text x="100" y="346" font-size="8" fill="#1a5276" text-anchor="middle">Cifra con</text>
  <text x="100" y="356" font-size="8" fill="#1a5276" text-anchor="middle">llave privada</text>

  <!-- SECRETION badge -->
  <rect x="60" y="370" width="80" height="16" rx="3" fill="#e74c3c"/>
  <text x="100" y="381" font-size="7.5" fill="white" font-weight="700" text-anchor="middle">ENCRYPTION</text>

  <!-- Key generation note -->
  <rect x="28" y="396" width="144" height="36" rx="4" fill="#fef9e7" stroke="#f39c12" stroke-width="1"/>
  <text x="100" y="409" font-size="8" fill="#784212" text-anchor="middle">Se generan por usuario</text>
  <text x="100" y="421" font-size="8" fill="#784212" text-anchor="middle">y se envían al</text>
  <text x="100" y="433" font-size="8" fill="#784212" text-anchor="middle">repositorio de llaves</text>

  <!-- ══════════════════════════════════════════
       SERVER / DECRYPTION — center
  ══════════════════════════════════════════ -->
  <!-- Server cylinder -->
  <ellipse cx="410" cy="295" rx="72" ry="18" fill="#aed6f1" stroke="#2980b9" stroke-width="1.5"/>
  <rect x="338" y="295" width="144" height="90" fill="#d6eaf8" stroke="#2980b9" stroke-width="1.5"/>
  <ellipse cx="410" cy="385" rx="72" ry="18" fill="#aed6f1" stroke="#2980b9" stroke-width="1.5"/>
  <text x="410" y="330" font-size="10.5" fill="#1a5276" text-anchor="middle" font-weight="700">Se descifra</text>
  <text x="410" y="346" font-size="10.5" fill="#1a5276" text-anchor="middle" font-weight="700">y procesa</text>
  <!-- unlock icon -->
  <rect x="393" y="354" width="36" height="26" rx="4" fill="#27ae60"/>
  <rect x="399" y="346" width="14" height="12" rx="7" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="411" cy="367" r="3.5" fill="white"/>

  <!-- AI box inside server -->
  <rect x="338" y="400" width="144" height="56" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
  <text x="410" y="418" font-size="9.5" fill="#145a32" text-anchor="middle" font-weight="700">Modelos de IA</text>
  <text x="410" y="432" font-size="8.5" fill="#145a32" text-anchor="middle">TTS · STT · BLIP · OCR</text>
  <text x="410" y="446" font-size="8.5" fill="#145a32" text-anchor="middle">Adaptación por perfil</text>

  <!-- ══════════════════════════════════════════
       RECEPTOR — right
  ══════════════════════════════════════════ -->
  <circle cx="720" cy="230" r="22" fill="#27ae60" filter="url(#sh)"/>
  <circle cx="720" cy="220" r="9" fill="#d5f5e3"/>
  <ellipse cx="720" cy="244" rx="13" ry="8" fill="#d5f5e3"/>
  <text x="720" y="260" font-size="10" fill="#145a32" text-anchor="middle" font-weight="700">Receptor</text>
  <text x="720" y="272" font-size="8.5" fill="#555" text-anchor="middle">(Perfil sensorial)</text>

  <!-- Re-encrypt at server for receptor -->
  <rect x="680" y="340" width="80" height="46" rx="5" fill="#eafaf1" stroke="#27ae60" stroke-width="1.3" filter="url(#sh)"/>
  <rect x="697" y="348" width="20" height="14" rx="10" fill="none" stroke="#27ae60" stroke-width="2"/>
  <rect x="693" y="358" width="28" height="20" rx="3" fill="#27ae60"/>
  <circle cx="707" cy="368" r="3" fill="white"/>
  <text x="720" y="396" font-size="8" fill="#145a32" text-anchor="middle">Re-cifra con</text>
  <text x="720" y="406" font-size="8" fill="#145a32" text-anchor="middle">llave receptor</text>

  <!-- Send to receptor -->
  <rect x="668" y="418" width="104" height="30" rx="4" fill="#27ae60"/>
  <text x="720" y="437" font-size="9" fill="white" font-weight="700" text-anchor="middle">Se envía al receptor</text>

  <!-- ══════════════════════════════════════════
       ARROWS
  ══════════════════════════════════════════ -->
  <!-- 1. Person1 → key repo (diagonal up-right) -->
  <line x1="120" y1="210" x2="358" y2="125" stroke="#f39c12" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-orange)"/>
  <text x="218" y="155" font-size="8" fill="#e67e22" transform="rotate(-22,218,155)">Envía llave pública</text>

  <!-- 2. Key repo → server (decryption arrow) -->
  <line x1="410" y1="182" x2="410" y2="275" stroke="#2980b9" stroke-width="1.4" marker-end="url(#arr-blue)"/>
  <text x="420" y="238" font-size="8" fill="#1a5276">Descifra con</text>
  <text x="420" y="248" font-size="8" fill="#1a5276">llave privada</text>

  <!-- 3. Person1 → server (message send) -->
  <line x1="180" y1="313" x2="336" y2="340" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="255" y="322" font-size="8.5" fill="#2c3e50" transform="rotate(12,255,322)">Mensaje cifrado</text>

  <!-- 4. Server → receptor -->
  <line x1="482" y1="340" x2="678" y2="368" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="580" y="347" font-size="8.5" fill="#145a32" transform="rotate(5,580,347)">Mensaje re-cifrado</text>

  <!-- 5. AI processing label arrow -->
  <path d="M 410 385 Q 410 400 410 400" stroke="#27ae60" stroke-width="1.3" fill="none" marker-end="url(#arr-green)"/>

  <!-- 6. Receptor ← server delivery -->
  <line x1="720" y1="252" x2="720" y2="338" stroke="#27ae60" stroke-width="1.3" stroke-dasharray="4,2" marker-end="url(#arr-green)"/>

  <!-- ══════════════════════════════════════════
       PROCESS STEPS — numbered callouts
  ══════════════════════════════════════════ -->
  <circle cx="190" cy="295" r="10" fill="#e74c3c"/>
  <text x="190" y="299" font-size="9" fill="white" font-weight="700" text-anchor="middle">1</text>

  <circle cx="350" cy="295" r="10" fill="#e67e22"/>
  <text x="350" y="299" font-size="9" fill="white" font-weight="700" text-anchor="middle">2</text>

  <circle cx="410" cy="460" r="10" fill="#27ae60"/>
  <text x="410" y="464" font-size="9" fill="white" font-weight="700" text-anchor="middle">3</text>

  <circle cx="630" cy="355" r="10" fill="#2980b9"/>
  <text x="630" y="359" font-size="9" fill="white" font-weight="700" text-anchor="middle">4</text>

  <!-- Step legend -->
  <rect x="28" y="490" width="764" height="40" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="0.8"/>
  <circle cx="48" cy="510" r="8" fill="#e74c3c"/>
  <text x="48" y="514" font-size="7" fill="white" font-weight="700" text-anchor="middle">1</text>
  <text x="62" y="514" font-size="8.5" fill="#2c3e50">Emisor cifra con su llave privada y genera vector IV</text>
  <circle cx="248" cy="510" r="8" fill="#e67e22"/>
  <text x="248" y="514" font-size="7" fill="white" font-weight="700" text-anchor="middle">2</text>
  <text x="262" y="514" font-size="8.5" fill="#2c3e50">Servidor descifra con llave del repositorio</text>
  <circle cx="448" cy="510" r="8" fill="#27ae60"/>
  <text x="448" y="514" font-size="7" fill="white" font-weight="700" text-anchor="middle">3</text>
  <text x="462" y="514" font-size="8.5" fill="#2c3e50">IA adapta el mensaje al perfil sensorial del receptor</text>
  <circle cx="638" cy="510" r="8" fill="#2980b9"/>
  <text x="638" y="514" font-size="7" fill="white" font-weight="700" text-anchor="middle">4</text>
  <text x="652" y="514" font-size="8.5" fill="#2c3e50">Re-cifrado y envío al receptor</text>
</svg>
