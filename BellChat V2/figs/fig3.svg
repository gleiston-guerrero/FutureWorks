<svg viewBox="0 0 720 580" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="vec" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#2c3e50"/>
    </marker>
    <marker id="vec-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- ── Background ── -->
  <rect width="720" height="580" fill="#fafafa" rx="8"/>

  <!-- ══ TITLE ══ -->
  <text x="360" y="20" font-size="13" fill="#2c3e50" font-weight="800" text-anchor="middle">
    Gráfico HJ-Biplot — Cuestionario TAM (n = 25)
  </text>
  <text x="360" y="36" font-size="10" fill="#7f8c8d" text-anchor="middle">
    Dim 1 (43.6 %) — Dim 2 (24.2 %) — Varianza acumulada: 67.8 %
  </text>

  <!-- ══ PLOT AREA ══
       Coordinate system:
       Origin at (370, 300)
       Scale: 1 unit = 55 px
       x range: [-5, 7] → px [97, 755]  but clipped to [58, 682]
       y range: [-5, 5] → px [25, 575]  but clipped to [55, 545]
  -->

  <!-- Plot border -->
  <rect x="58" y="55" width="604" height="450" fill="white" stroke="#bdc3c7" stroke-width="1.2" rx="4"/>

  <!-- Grid lines -->
  <!-- Vertical grid at x= -4,-2,0,2,4,6 -->
  <!-- Origin at px_x=370  unit=55 -->
  <!-- x=-4 → 370+(-4*55)=150  x=-2 → 260  x=0 → 370  x=2 → 480  x=4 → 590  x=6 → 700 clip 682 -->
  <line x1="150" y1="55" x2="150" y2="505" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="260" y1="55" x2="260" y2="505" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="370" y1="55" x2="370" y2="505" stroke="#bdc3c7" stroke-width="1.3"/><!-- y-axis -->
  <line x1="480" y1="55" x2="480" y2="505" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="590" y1="55" x2="590" y2="505" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="658" y1="55" x2="658" y2="505" stroke="#ecf0f1" stroke-width="0.7" stroke-dasharray="3,3"/>

  <!-- Horizontal grid at y= -4,-2,0,2,4 -->
  <!-- Origin at px_y=280  unit=45 (compressed for aspect ratio) -->
  <!-- y=4 → 280-(4*45)=100  y=2 → 190  y=0 → 280  y=-2 → 370  y=-4 → 460 -->
  <line x1="58" y1="100" x2="662" y2="100" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="58" y1="190" x2="662" y2="190" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="58" y1="280" x2="662" y2="280" stroke="#bdc3c7" stroke-width="1.3"/><!-- x-axis -->
  <line x1="58" y1="370" x2="662" y2="370" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="58" y1="460" x2="662" y2="460" stroke="#ecf0f1" stroke-width="1"/>

  <!-- Axis tick labels -->
  <!-- x-axis labels -->
  <text x="150" y="520" font-size="9.5" fill="#555" text-anchor="middle">−4</text>
  <text x="260" y="520" font-size="9.5" fill="#555" text-anchor="middle">−2</text>
  <text x="370" y="520" font-size="9.5" fill="#555" text-anchor="middle">0</text>
  <text x="480" y="520" font-size="9.5" fill="#555" text-anchor="middle">2</text>
  <text x="590" y="520" font-size="9.5" fill="#555" text-anchor="middle">4</text>
  <text x="658" y="520" font-size="9.5" fill="#555" text-anchor="middle">6</text>

  <!-- y-axis labels -->
  <text x="48" y="104" font-size="9.5" fill="#555" text-anchor="end">4</text>
  <text x="48" y="194" font-size="9.5" fill="#555" text-anchor="end">2</text>
  <text x="48" y="284" font-size="9.5" fill="#555" text-anchor="end">0</text>
  <text x="48" y="374" font-size="9.5" fill="#555" text-anchor="end">−2</text>
  <text x="48" y="464" font-size="9.5" fill="#555" text-anchor="end">−4</text>

  <!-- Axis labels -->
  <text x="360" y="545" font-size="10" fill="#2c3e50" text-anchor="middle" font-weight="600">Dimensión 1 (43.6 %)</text>
  <text x="16" y="280" font-size="10" fill="#2c3e50" text-anchor="middle" font-weight="600" transform="rotate(-90,16,280)">Dimensión 2 (24.2 %)</text>

  <!-- ══════════════════════════════════════════
       ITEM VECTORS — origin (370,280)
       Coordinates read from actual biplot image:
       PTAM001: (-3.5, -3.8)  → px (178, 451)
       PTAM002: (-3.2, -3.5)  → px (194, 438)
       PTAM003: (-3.7, -4.0)  → px (166, 460)
       PTAM004: (-2.8, -4.0)  → px (216, 460)
       PTAM005: (-3.2, -2.8)  → px (194, 406)  ← UP cluster
       PTAM006: (-3.4, -2.0)  → px (183, 370)
       PTAM007:  (-3.8,  2.5) → px (161, 168)  ← orthogonal
       PTAM008:  (-3.2,  2.0) → px (194, 190)
       PTAM009:  (-2.8,  1.0) → px (216, 235)
       PTAM010:  (-2.6,  0.8) → px (227, 244)
       PTAM011:  (-3.0,  3.2) → px (205, 136)
       PTAM012:  (-3.6,  3.8) → px (172, 109)  ← orthogonal
  ══════════════════════════════════════════ -->

  <!-- UP cluster vectors (dark gray) — PTAM001–006 -->
  <line x1="370" y1="280" x2="178" y2="451" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#vec)"/>
  <line x1="370" y1="280" x2="194" y2="438" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#vec)"/>
  <line x1="370" y1="280" x2="166" y2="460" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#vec)"/>
  <line x1="370" y1="280" x2="216" y2="460" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#vec)"/>
  <line x1="370" y1="280" x2="194" y2="406" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#vec)"/>
  <line x1="370" y1="280" x2="183" y2="370" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#vec)"/>

  <!-- FUP partial vectors — PTAM008–010 (gray) -->
  <line x1="370" y1="280" x2="194" y2="190" stroke="#7f8c8d" stroke-width="1.5" marker-end="url(#vec)"/>
  <line x1="370" y1="280" x2="216" y2="235" stroke="#7f8c8d" stroke-width="1.5" marker-end="url(#vec)"/>
  <line x1="370" y1="280" x2="227" y2="244" stroke="#7f8c8d" stroke-width="1.5" marker-end="url(#vec)"/>

  <!-- PTAM007, PTAM011, PTAM012 — orthogonal (red) -->
  <line x1="370" y1="280" x2="161" y2="168" stroke="#c0392b" stroke-width="2.0" marker-end="url(#vec-red)"/>
  <line x1="370" y1="280" x2="205" y2="136" stroke="#c0392b" stroke-width="2.0" marker-end="url(#vec-red)"/>
  <line x1="370" y1="280" x2="172" y2="109" stroke="#c0392b" stroke-width="2.0" marker-end="url(#vec-red)"/>

  <!-- Item labels -->
  <text x="164" y="468" font-size="8.5" fill="#2c3e50" text-anchor="end">PTAM003</text>
  <text x="178" y="461" font-size="8.5" fill="#2c3e50" text-anchor="end">PTAM001</text>
  <text x="194" y="450" font-size="8.5" fill="#2c3e50" text-anchor="end">PTAM002</text>
  <text x="214" y="474" font-size="8.5" fill="#2c3e50" text-anchor="end">PTAM004</text>
  <text x="180" y="402" font-size="8.5" fill="#2c3e50" text-anchor="end">PTAM005</text>
  <text x="168" y="368" font-size="8.5" fill="#2c3e50" text-anchor="end">PTAM006</text>

  <text x="157" y="166" font-size="8.5" fill="#c0392b" text-anchor="end">PTAM007</text>
  <text x="188" y="132" font-size="8.5" fill="#c0392b" text-anchor="end">PTAM011</text>
  <text x="160" y="107" font-size="8.5" fill="#c0392b" text-anchor="end">PTAM012</text>

  <text x="182" y="188" font-size="8.5" fill="#7f8c8d" text-anchor="end">PTAM008</text>
  <text x="200" y="233" font-size="8.5" fill="#7f8c8d" text-anchor="end">PTAM009</text>
  <text x="215" y="242" font-size="8.5" fill="#7f8c8d" text-anchor="end">PTAM010</text>

  <!-- ══════════════════════════════════════════
       PARTICIPANTS — small circles with numbers
       (coordinates estimated from actual biplot)
  ══════════════════════════════════════════ -->
  <!-- Cluster participants (UP-aligned, SW quadrant) -->
  <circle cx="290" cy="258" r="4" fill="#3498db"/><text x="296" y="261" font-size="7.5" fill="#2c3e50">3</text>
  <circle cx="305" cy="270" r="4" fill="#3498db"/><text x="311" y="273" font-size="7.5" fill="#2c3e50">15</text>
  <circle cx="280" cy="242" r="4" fill="#3498db"/><text x="286" y="245" font-size="7.5" fill="#2c3e50">22</text>
  <circle cx="295" cy="228" r="4" fill="#3498db"/><text x="301" y="231" font-size="7.5" fill="#2c3e50">23</text>
  <circle cx="310" cy="218" r="4" fill="#3498db"/><text x="316" y="221" font-size="7.5" fill="#2c3e50">14</text>
  <circle cx="325" cy="210" r="4" fill="#3498db"/><text x="331" y="213" font-size="7.5" fill="#2c3e50">19</text>
  <circle cx="340" cy="244" r="4" fill="#3498db"/><text x="346" y="247" font-size="7.5" fill="#2c3e50">4</text>
  <circle cx="330" cy="262" r="4" fill="#3498db"/><text x="336" y="265" font-size="7.5" fill="#2c3e50">26</text>
  <circle cx="345" cy="228" r="4" fill="#3498db"/><text x="351" y="231" font-size="7.5" fill="#2c3e50">16</text>
  <!-- Middle cluster -->
  <circle cx="360" cy="190" r="4" fill="#3498db"/><text x="366" y="193" font-size="7.5" fill="#2c3e50">5</text>
  <circle cx="380" cy="178" r="4" fill="#3498db"/><text x="386" y="181" font-size="7.5" fill="#2c3e50">24</text>
  <circle cx="385" cy="198" r="4" fill="#3498db"/><text x="391" y="201" font-size="7.5" fill="#2c3e50">2</text>
  <!-- Outliers right side (low UP, high positive x) -->
  <circle cx="532" cy="190" r="4" fill="#e74c3c"/><text x="538" y="193" font-size="7.5" fill="#c0392b">8</text>
  <circle cx="644" cy="178" r="4" fill="#e74c3c"/><text x="650" y="181" font-size="7.5" fill="#c0392b">17</text>
  <circle cx="532" cy="358" r="4" fill="#e74c3c"/><text x="538" y="361" font-size="7.5" fill="#c0392b">18</text>
  <circle cx="476" cy="392" r="4" fill="#e74c3c"/><text x="482" y="395" font-size="7.5" fill="#c0392b">25</text>
  <circle cx="508" cy="382" r="4" fill="#e74c3c"/><text x="514" y="385" font-size="7.5" fill="#c0392b">10</text>
  <!-- More scattered -->
  <circle cx="318" cy="302" r="4" fill="#3498db"/><text x="324" y="305" font-size="7.5" fill="#2c3e50">1</text>
  <circle cx="332" cy="290" r="4" fill="#3498db"/><text x="338" y="293" font-size="7.5" fill="#2c3e50">7</text>
  <circle cx="345" cy="308" r="4" fill="#3498db"/><text x="351" y="311" font-size="7.5" fill="#2c3e50">6</text>
  <circle cx="355" cy="318" r="4" fill="#3498db"/><text x="361" y="321" font-size="7.5" fill="#2c3e50">9</text>
  <circle cx="310" cy="344" r="4" fill="#3498db"/><text x="316" y="347" font-size="7.5" fill="#2c3e50">21</text>
  <circle cx="320" cy="332" r="4" fill="#3498db"/><text x="326" y="335" font-size="7.5" fill="#2c3e50">12</text>
  <circle cx="308" cy="360" r="4" fill="#3498db"/><text x="314" y="363" font-size="7.5" fill="#2c3e50">20</text>
  <circle cx="296" cy="372" r="4" fill="#3498db"/><text x="302" y="375" font-size="7.5" fill="#2c3e50">p</text>
  <circle cx="280" cy="316" r="4" fill="#3498db"/><text x="286" y="319" font-size="7.5" fill="#2c3e50">11</text>
  <circle cx="268" cy="290" r="4" fill="#3498db"/><text x="274" y="293" font-size="7.5" fill="#2c3e50">13</text>

  <!-- ══ CLUSTER ANNOTATION ══ -->
  <!-- UP cluster ellipse -->
  <ellipse cx="200" cy="415" rx="90" ry="80" fill="none" stroke="#2c3e50" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.5"/>
  <text x="118" y="498" font-size="8.5" fill="#2c3e50" font-weight="600">Cluster UP</text>
  <text x="118" y="508" font-size="8.5" fill="#2c3e50" font-weight="600">(PTAM001–006)</text>

  <!-- Orthogonal note -->
  <line x1="268" y1="182" x2="300" y2="214" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="3,2"/>
  <rect x="192" y="68" width="118" height="32" rx="4" fill="#fdedec" stroke="#c0392b" stroke-width="1"/>
  <text x="251" y="83" font-size="8.5" fill="#c0392b" text-anchor="middle" font-weight="600">Ortogonales:</text>
  <text x="251" y="94" font-size="8.5" fill="#c0392b" text-anchor="middle">PTAM007, 011, 012</text>

  <!-- ══ LEGEND ══ -->
  <rect x="58" y="512" width="604" height="56" rx="4" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="0.8"/>
  <!-- Vector types -->
  <line x1="74" y1="533" x2="98" y2="533" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#vec)"/>
  <text x="103" y="537" font-size="8.5" fill="#2c3e50">Ítems UP (PTAM001–006) — Cluster principal</text>
  <line x1="74" y1="553" x2="98" y2="553" stroke="#c0392b" stroke-width="2.0" marker-end="url(#vec-red)"/>
  <text x="103" y="557" font-size="8.5" fill="#c0392b">Ítems ortogonales (PTAM007, 011, 012) — Varianza independiente</text>
  <!-- Participant dots -->
  <circle cx="370" cy="533" r="5" fill="#3498db"/>
  <text x="379" y="537" font-size="8.5" fill="#2c3e50">Participante (cluster UP)</text>
  <circle cx="370" cy="553" r="5" fill="#e74c3c"/>
  <text x="379" y="557" font-size="8.5" fill="#c0392b">Participante (cuadrante opuesto)</text>
  <!-- FUP partial -->
  <line x1="540" y1="533" x2="564" y2="533" stroke="#7f8c8d" stroke-width="1.5" marker-end="url(#vec)"/>
  <text x="569" y="537" font-size="8.5" fill="#7f8c8d">Ítems FUP (PTAM008–010)</text>
</svg>
